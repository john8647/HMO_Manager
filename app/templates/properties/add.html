{% extends "base.html" %}
{% block title %}Add Property{% endblock %}

{% block content %}
<div class="flex-between mb-2">
    <h1>Add Property</h1>
    <a href="{{ url_for('properties.index') }}" class="btn btn-secondary">&larr; Back</a>
</div>

<div style="max-width: 520px;">
    <form method="POST" action="{{ url_for('properties.add') }}">

        <div class="form-group">
            <label for="property_ref">Property Reference</label>
            <input type="text" id="property_ref" name="property_ref"
                   placeholder="e.g. House 31" value="{{ request.form.get('property_ref', '') }}">
            <span class="form-hint">A short internal reference name for this property.</span>
        </div>

        <div class="form-group">
            <label for="address_line1">Address Line 1 <span style="color:var(--error);">*</span></label>
            <input type="text" id="address_line1" name="address_line1"
                   placeholder="e.g. 31 Example Street"
                   value="{{ request.form.get('address_line1', '') }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="address_line2">Address Line 2</label>
            <input type="text" id="address_line2" name="address_line2"
                   placeholder="e.g. Stoke"
                   value="{{ request.form.get('address_line2', '') }}">
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city"
                   placeholder="e.g. Coventry"
                   value="{{ request.form.get('city', '') }}">
        </div>

        <div class="form-group">
            <label for="postcode">Postcode</label>
            <input type="text" id="postcode" name="postcode"
                   placeholder="e.g. CV1 2AB"
                   value="{{ request.form.get('postcode', '') }}"
                   style="max-width: 160px;">
        </div>

        <div class="mt-2">
            <button type="submit" class="btn btn-primary">Save Property</button>
            <a href="{{ url_for('properties.index') }}"
               class="btn btn-secondary" style="margin-left: 8px;">Cancel</a>
        </div>

    </form>
</div>
{% endblock %}
