<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — HMO Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            background: var(--grey-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .login-box {
            background: var(--white);
            border-top: 4px solid var(--green-primary);
            padding: 36px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .login-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .login-logo-mark {
            color: var(--green-primary);
            font-size: 28px;
        }
        .login-logo-text {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .login-box h1 {
            font-size: 22px;
            border: none;
            margin-bottom: 24px;
            padding: 0;
        }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .remember-row input {
            width: auto;
        }
        .btn-full {
            width: 100%;
            padding: 10px;
            font-size: 16px;
        }
        .login-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <div class="logo">
            <span class="logo-mark">&#9632;</span>
            <span class="logo-text">HMO Manager</span>
        </div>
    </div>
</header>

<div class="login-wrap">
    <div class="login-box">

        <div class="login-logo">
            <span class="login-logo-mark">&#9632;</span>
            <span class="login-logo-text">HMO Manager</span>
        </div>

        <h1>Sign in</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <div class="remember-row">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember" style="font-weight:normal; margin:0;">
                    Keep me signed in
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign in</button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('auth.change_password') }}">Change password</a>
        </div>

    </div>
</div>

<footer class="site-footer">
    <p>HMO Landlord Management System &mdash; Private use only</p>
</footer>

</body>
</html>
