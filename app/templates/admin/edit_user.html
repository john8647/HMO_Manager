{% extends "base.html" %}
{% block title %}Edit User — {{ user.username }}{% endblock %}

{% block content %}
<div class="flex-between mb-2">
    <h1>Edit User — {{ user.username }}</h1>
    <a href="{{ url_for('admin.index') }}" class="btn btn-secondary">&larr; Back</a>
</div>

<div style="max-width:480px; margin-top:20px;">
<form method="POST"
      action="{{ url_for('admin.edit_user', user_id=user.id) }}">

    <div class="form-group">
        <label for="username">Username <span style="color:var(--error);">*</span></label>
        <input type="text" id="username" name="username"
               value="{{ user.username }}" required autofocus>
    </div>

    <div class="form-group">
        <label for="email">Email <span style="color:var(--error);">*</span></label>
        <input type="email" id="email" name="email"
               value="{{ user.email }}" required>
    </div>

    <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role">
            <option value="admin"
                {% if user.role == 'admin' %}selected{% endif %}>
                Administrator
            </option>
            <option value="landlord"
                {% if user.role == 'landlord' %}selected{% endif %}>
                Landlord
            </option>
            <option value="tenant"
                {% if user.role == 'tenant' %}selected{% endif %}>
                Tenant (Portal)
            </option>
        </select>
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
        <input type="checkbox" id="is_active" name="is_active"
               style="width:auto;"
               {% if user.is_active %}checked{% endif %}>
        <label for="is_active" style="font-weight:normal; margin:0;">
            Account is active (uncheck to disable login)
        </label>
    </div>

    <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password">
        <span class="form-hint">
            Leave blank to keep the current password.
            Minimum 8 characters if changing.
        </span>
    </div>

    <div class="mt-2">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admin.index') }}"
           class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
    </div>

</form>
</div>
{% endblock %}
