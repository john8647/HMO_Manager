{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}

{% block content %}
<div class="flex-between mb-2">
    <h1>Edit Expense</h1>
    <a href="{{ url_for('expenses.index') }}" class="btn btn-secondary">&larr; Back</a>
</div>

<div style="max-width:580px; margin-top:20px;">
<form method="POST"
      action="{{ url_for('expenses.edit', expense_id=expense.id) }}">

    <div class="form-group">
        <label for="description">
            Description <span style="color:var(--error);">*</span>
        </label>
        <input type="text" id="description" name="description"
               value="{{ expense.description }}" required autofocus>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group">
            <label for="amount">
                Amount (£) <span style="color:var(--error);">*</span>
            </label>
            <input type="number" id="amount" name="amount"
                   step="0.01" min="0.01"
                   value="{{ expense.amount }}" required>
        </div>
        <div class="form-group">
            <label for="expense_date">
                Date <span style="color:var(--error);">*</span>
            </label>
            <input type="date" id="expense_date" name="expense_date"
                   value="{{ expense.expense_date.isoformat() }}" required>
        </div>
    </div>

    <div class="form-group">
        <label for="property_id">Property</label>
        <select id="property_id" name="property_id">
            <option value="">— General business expense —</option>
            {% for prop in properties %}
            <option value="{{ prop.id }}"
                {% if expense.property_id == prop.id %}selected{% endif %}>
                {{ prop.property_ref or prop.address_line1 }} — {{ prop.postcode }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="charge_type_id">HMRC Category</label>
        <select id="charge_type_id" name="charge_type_id">
            <option value="">— Select category —</option>
            {% for charge in charge_types %}
            <option value="{{ charge.id }}"
                {% if expense.charge_type_id == charge.id %}selected{% endif %}>
                {{ charge.charge_name }}
                {% if charge.hmrc_category %} — {{ charge.hmrc_category }}{% endif %}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="source">Source</label>
        <select id="source" name="source">
            <option value="manual"
                {% if expense.source == 'manual' %}selected{% endif %}>
                Manual entry
            </option>
            <option value="bank"
                {% if expense.source == 'bank' %}selected{% endif %}>
                Bank payment
            </option>
            <option value="cash"
                {% if expense.source == 'cash' %}selected{% endif %}>
                Cash payment
            </option>
        </select>
    </div>

    <div class="form-group">
        <label for="notes">Notes / Reference</label>
        <input type="text" id="notes" name="notes"
               value="{{ expense.notes or '' }}">
    </div>

    <div class="mt-2">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('expenses.index') }}"
           class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
    </div>

</form>
</div>
{% endblock %}
