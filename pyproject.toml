[project]
name = "hmo-landlord-system"
version = "0.1.0"
description = "HMO Landlord and Tenant Management System"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.5",
    "flask-wtf>=1.2.1",
    "wtforms>=3.1.2",
    "werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "xhtml2pdf>=0.2.28",
    "python-dateutil>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
